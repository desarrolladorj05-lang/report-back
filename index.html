<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Reporte Gerencial API Docs</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --base-font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.7;
      --base-background-color: #111827;
      --base-color: #d1d5db;
      --heading-color: #f9fafb;
      --heading-font-weight: 700;
      --link-color: #2dd4bf;
      --link-color--hover: #5eead4;
      --sidebar-background: #0f172a;
      --sidebar-border-color: #273449;
      --sidebar-name-color: #f9fafb;
      --sidebar-nav-link-color: #cbd5e1;
      --sidebar-nav-link-color--active: #ffffff;
      --sidebar-nav-link-background--active: rgba(45, 212, 191, 0.12);
      --sidebar-nav-strong-color: #5eead4;
      --search-input-background-color: #172033;
      --search-input-border-color: #334155;
      --search-input-color: #e5e7eb;
      --code-theme-background: #0a1020;
      --code-inline-background: #1f2937;
      --code-inline-color: #99f6e4;
      --content-max-width: 1040px;
    }
    body { background: #111827; }
    .markdown-section { padding: 2rem 2.5rem 4rem; }
    .markdown-section h2 { border-bottom: 1px solid #273449; padding-bottom: 0.45rem; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section pre { border: 1px solid #273449; }
    @media (max-width: 768px) {
      .markdown-section { padding: 1.5rem 1.25rem 3rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Reporte Gerencial API',
      nameLink: '/',
      basePath: 'docs/',
      loadSidebar: true,
      homepage: 'index.md',
      subMaxLevel: 2,
      search: {
        placeholder: 'Buscar',
        noData: 'Sin resultados',
        depth: 6,
        hideOtherSidebarContent: true
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
